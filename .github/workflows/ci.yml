name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, homolog, main]

jobs:
  verificar:
    name: Compilar e testar
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reservas

    steps:
      - uses: actions/checkout@v6

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e testar
        run: ./mvnw -B --no-transfer-progress verify

      - name: Guardar os relatórios de teste
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorios-de-teste
          path: reservas/target/surefire-reports/
          if-no-files-found: ignore
